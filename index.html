<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 Manrope,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--nv);color:#cfd9ee;padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;transition:width .2s}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700;padding:4px 8px 16px}.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2f7bff,#12b5a0);display:grid;place-items:center;font-style:normal}
.nav{background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center}.nav:hover{background:#ffffff14}.nav.on{background:#ffffff22;color:#fff;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:#8fa3c8;padding:8px}
main{padding:0 24px 80px;min-width:0}
.top{display:flex;gap:10px;align-items:center;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.top .sr{flex:1;max-width:420px;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;color:var(--mu)}
.ic{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;position:relative}.dot{position:absolute;top:5px;right:6px;width:8px;height:8px;background:var(--rd);border-radius:50%}
#menu{display:none}
h1{margin:6px 0 2px;font-size:24px;letter-spacing:-.02em}.sub{color:var(--mu);margin:0 0 16px}.crumb{color:var(--mu);font-size:12px}
.banner{background:var(--bs);color:var(--bl);border-radius:8px;padding:6px 12px;font-size:12px;margin-bottom:10px}
.grid{display:grid;gap:14px}.k6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px;box-shadow:0 1px 2px #0f1b3310;min-width:0}
.card h3{margin:0 0 10px;font-size:15px}.kv{font-size:26px;font-weight:700;letter-spacing:-.02em}.mu{color:var(--mu);font-size:12px}
.b{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}.green{background:#13966b22;color:var(--gr)}.amber{background:#d98a0b22;color:var(--am)}.red{background:#d23a3a22;color:var(--rd)}.done{background:var(--bs);color:var(--bl)}
.bar{height:7px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl);border-radius:9px;transition:width .8s}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bs)}.sc{overflow-x:auto}
.bt{background:var(--bl);color:#fff;border:0;border-radius:9px;padding:8px 14px;font-weight:600}.bt.g{background:var(--cd);color:var(--tx);border:1px solid var(--ln)}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{background:var(--cd);border:1px solid var(--ln);border-radius:9px;padding:8px 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:14px;overflow-x:auto}.tab{background:none;border:0;padding:9px 12px;color:var(--mu);border-bottom:2px solid transparent}.tab.on{color:var(--bl);border-color:var(--bl);font-weight:600}
.pc{cursor:pointer;transition:transform .15s}.pc:hover{transform:translateY(-2px)}
.tl{border-left:2px solid var(--ln);padding-left:14px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bl)}
.gantt{min-width:640px}.gr{display:grid;grid-template-columns:200px 1fr;align-items:center;border-bottom:1px solid var(--ln);padding:5px 0}.gt{position:relative;height:18px;background:repeating-linear-gradient(90deg,var(--ln) 0 1px,transparent 1px 5%)}
.gb{position:absolute;height:18px;border-radius:5px;background:#9ec0f5;overflow:hidden}.gb i{display:block;height:100%;background:var(--bl);transition:width .8s}.gb.cr{background:#f1b3b3}.gb.cr i{background:var(--rd)}
.mx{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:360px}.mx div{aspect-ratio:1.3;border-radius:6px;display:grid;place-items:center;font-weight:600;color:#fff;font-size:13px}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px;animation:f .15s}.md{background:var(--cd);border-radius:14px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--cd);z-index:21;padding:20px;overflow:auto;box-shadow:-8px 0 30px #0004;animation:s .2s}
@keyframes f{from{opacity:0}}@keyframes s{from{transform:translateX(30px);opacity:0}}
.fm label{display:block;margin:10px 0 3px;font-size:12px;color:var(--mu)}.fm input,.fm select,.fm textarea{width:100%}.er{color:var(--rd);font-size:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;display:none}
.fab{position:fixed;right:20px;bottom:20px;width:48px;height:48px;border-radius:50%;background:var(--bl);color:#fff;border:0;font-size:24px;z-index:9;box-shadow:0 6px 18px #0004}
.cm{display:flex;gap:8px;padding:8px 0;align-items:center}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:fixed;left:-240px;width:230px;z-index:15;transition:left .2s}aside.open{left:0}#menu{display:block}main{padding:0 14px 80px}}
@media(prefers-color-scheme:light){:root{--bg:#edf1f4;--bl:#0b6e99;--bs:#dcecf3;--nv:#071a33}}
h1,.kv{font-family:Newsreader,Georgia,serif;font-weight:600}h1{font-size:32px}.kv{font-size:30px}
main{background-image:linear-gradient(#0b6e9910 1px,transparent 1px),linear-gradient(90deg,#0b6e9910 1px,transparent 1px);background-size:32px 32px}
.card{border-radius:6px;box-shadow:none}.k6 .card{border-top:3px solid var(--bl)}.b{border-radius:4px}
.nav.on{box-shadow:inset 3px 0 #5fe0c0;background:#ffffff18;border-radius:0 8px 8px 0}aside{background:linear-gradient(180deg,#071a33,#0a3550)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(120deg,#071a33,#0b4a63);color:#fff;border:0;flex-wrap:wrap}.hero h2{font:600 30px/1.15 Newsreader,Georgia,serif;margin:4px 0 8px}.hero p{color:#cfe3ea;max-width:46ch}
/* ===== Enhancements ===== */
:root[data-theme=dark]{--bg:#0c1424;--cd:#142038;--tx:#e8eefc;--mu:#93a3c0;--ln:#25344f;--nv:#060d1b;--bs:#1b2f55;--bl:#6aa1ff;color-scheme:dark}
:root[data-theme=light]{--bg:#edf1f4;--cd:#fff;--tx:#0f1b33;--mu:#5b6880;--ln:#e2e7ef;--nv:#071a33;--bl:#0b6e99;--bs:#dcecf3;color-scheme:light}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes gr{from{transform:scaleX(0)}}
@keyframes dr{from{stroke-dashoffset:1}}
@keyframes ring{from{stroke-dasharray:0 314}}
@keyframes seg{from{stroke-dasharray:0 252}}
@keyframes bg{50%{background-position:100% 50%}}
@keyframes pl{0%{box-shadow:0 0 0 0 #d23a3a99}100%{box-shadow:0 0 0 9px #d23a3a00}}
@keyframes slin{from{opacity:0;transform:translateX(-16px);background:var(--bs)}}
@keyframes cf{40%{transform:translate(calc(var(--x)*.6),var(--y))}100%{transform:translate(var(--x),320px) rotate(720deg);opacity:0}}
.an .card{animation:up .55s cubic-bezier(.2,.8,.2,1) backwards}
.an .bar i,.an .gb i{transform-origin:left;animation:gr .9s cubic-bezier(.2,.8,.2,1) backwards .25s}
.an polyline[stroke-width="3"],.an .sp polyline{stroke-dasharray:1;animation:dr 1.3s ease-out backwards .35s}
.an .hero{animation:up .55s backwards,bg 14s ease infinite}
.an .hero circle:nth-child(2){animation:ring 1.5s cubic-bezier(.2,.8,.2,1) backwards .3s}
.an .seg{animation:seg 1s ease-out backwards .3s}
.hero{background:linear-gradient(120deg,#071a33,#0b4a63,#0a6b7a,#071a33);background-size:250% 250%}
.dot{animation:pl 1.6s infinite}
.card{transition:box-shadow .2s,transform .2s,border-color .2s}.card:hover{border-color:var(--bl);box-shadow:0 10px 28px #0b244720}
.k6 .card.pc:hover{transform:translateY(-3px)}
.nav{transition:background .2s,padding .2s}.nav:hover{padding-left:15px}.logo i{transition:transform .5s}.logo:hover i{transform:rotate(180deg)}
.bt{transition:transform .15s,filter .15s}.bt:hover{filter:brightness(1.1);transform:translateY(-1px)}.bt:active{transform:scale(.96)}
.tb{margin:4px 0 10px}.sp{display:block;margin-top:6px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gr);margin-right:6px;animation:pl 1.6s infinite;--c:#13966b}
.fi{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}.fi span:nth-of-type(1){flex:1}.fi.new{animation:slin .6s}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}.dt.green{background:var(--gr)}.dt.amber{background:var(--am)}.dt.red{background:var(--rd)}
input[type=range]{width:100%;accent-color:var(--bl);padding:0}input[type=checkbox]{accent-color:var(--bl)}
.fm-on aside{display:none}.fm-on .app{grid-template-columns:1fr}
.cf{position:fixed;top:60vh;width:8px;height:12px;z-index:40;pointer-events:none;animation:cf 1.5s ease-out forwards}
@keyframes lgd{from{stroke-dashoffset:1}}@keyframes pop{from{transform:scale(0)}}@keyframes lgp{50%{transform:scale(1.35)}}
.logo i{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 14px #2f7bff55}.logo:hover i{transform:rotate(-8deg) scale(1.08)}
.lg-p{stroke-dasharray:1;animation:lgd 1.4s ease-out backwards .3s}.lg-n,.lg-e{transform-box:fill-box;transform-origin:center}.lg-n{animation:pop .5s backwards .5s}.lg-e{animation:pop .5s backwards 1.4s,lgp 2.4s ease-in-out infinite 2s}
.lw{display:flex;flex-direction:column;line-height:1.1}.lw b{font:600 19px Newsreader,Georgia,serif;letter-spacing:-.01em}.lw small{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8fa3c8;margin-top:3px}
/* ===== AI layer ===== */
.cop{background:linear-gradient(var(--cd),var(--cd)) padding-box,linear-gradient(120deg,#2f7bff,#12b5a0,#a06bff) border-box;border:2px solid transparent!important;border-radius:12px}
.spk{display:inline-block;background:linear-gradient(135deg,#2f7bff,#12b5a0);-webkit-background-clip:text;background-clip:text;color:transparent;animation:tw 2.4s infinite}
@keyframes tw{50%{transform:scale(1.3) rotate(25deg)}}@keyframes bl{50%{opacity:0}}@keyframes bn{50%{transform:translateY(-4px);opacity:.4}}@keyframes sp{to{transform:rotate(360deg)}}
.brief{min-height:48px;font-size:15px}.brief.typing:after{content:"▍";color:var(--bl);animation:bl .8s infinite}
.chip{background:var(--bs);color:var(--bl);border:0;border-radius:20px;padding:5px 12px;font-weight:600;transition:transform .15s}.chip:hover{transform:translateY(-2px)}
.ans{margin-top:10px;padding:12px;border-radius:8px;background:var(--bs);animation:up .4s}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--bl);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.au{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}
.sw{position:relative;width:38px;height:22px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:var(--ln);border-radius:20px;transition:.25s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}.sw input:checked+i{background:var(--gr)}.sw input:checked+i:after{transform:translateX(16px)}
.sg{padding:10px;border:1px dashed var(--ln);border-radius:8px;margin:8px 0;animation:up .4s}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--bl);border-top-color:transparent;border-radius:50%;margin-right:6px;animation:sp .7s linear infinite}
.bub{transform-box:fill-box;transform-origin:center;transition:transform .2s}.bub:hover{transform:scale(1.15)}.an .bub{animation:pop .7s backwards}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="app"><aside id="sd"><div class="logo"><i><svg viewBox="0 0 34 34" width="34" height="34" aria-hidden="true"><path d="M17 4 30 17 17 30 4 17Z" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linejoin="round"/><polyline class="lg-p" pathLength="1" points="9,21 15,16 19,19 25,12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="lg-n" cx="9" cy="21" r="2" fill="#fff"/><circle class="lg-n" cx="19" cy="19" r="2" fill="#fff"/><circle class="lg-e" cx="25" cy="12" r="3" fill="#5fe0c0"/></svg></i><span class="lw"><b>Delivery Hub</b><small>Project execution</small></span></div><div id="nav"></div><div class="side-foot">Concept prototype<br>Fictional demo data</div></aside>

<script>

{id:'VP-102',n:'Fill-Finish Line Upgrade',o:'Calder Pharma',pm:'Marcus Lee',cat:'Process Upgrade',pr:81,s:'green',b:'green',bud:22.5,act:17.9,com:2.1,fc:22.1,ms:'Line FAT · 9 Dec',st:'Jan 2026',en:'Mar 2027'},

function run(k){const a=AU.find(x=>x[0]==k),st=a[3].split('|'),el=$('#ar-'+k);if(!el||el.dataset.b)return;el.dataset.b=1;let i=0;const t=setInterval(()=>{if(i<st.length){el.innerHTML=`<span class="spin"></span>${st[i++]}`}else{clearInterval(t);A.hrs+=a[5];A.log.unshift(['Autopilot: '+a[4],tm()]);A.log=A.log.slice(0,6);ai();toast(a[4]+' · '+a[5]+'h saved')}},700)}
const radar=()=>{const a=act(),X=p=>50+p.pr*4.8,Y=p=>170-(Math.max(-2,Math.min((p.fc-p.bud)/p.bud*100,16))+2)/18*150;
return `<div class="card"><h3>Portfolio radar <span class="mu">progress vs forecast overrun · bubble size = budget · click a bubble</span></h3><svg viewBox="0 0 580 210" width="100%"><rect x="50" y="20" width="240" height="75" fill="#d23a3a" opacity=".08"/><text x="56" y="34" font-size="10" fill="var(--rd)">DANGER ZONE</text><g stroke="var(--ln)">${[0,1,2,3].map(i=>`<line x1="50" x2="530" y1="${20+i*50}" y2="${20+i*50}"/>`).join('')}</g>${a.map((p,i)=>`<g class="bub pc" data-p="${p.id}" style="animation-delay:${i*90}ms"><circle cx="${X(p)}" cy="${Y(p)}" r="${6+Math.sqrt(p.bud)*2.2}" fill="var(--${p.s=='green'?'gr':p.s=='amber'?'am':'rd'})" fill-opacity=".8" stroke="var(--cd)" stroke-width="2"><title>${p.n}: ${p.pr}% done, ${((p.fc-p.bud)/p.bud*100).toFixed(1)}% over budget</title></circle><text x="${X(p)}" y="${Y(p)+3}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${p.id.slice(3)}</text></g>`).join('')}<text x="50" y="203" font-size="10" fill="var(--mu)">0% complete</text><text x="530" y="203" font-size="10" text-anchor="end" fill="var(--mu)">100% complete</text></svg></div>`};
const ov1=ov;
ov=function(){let h=ov1();h=h.replace('<div class="card sc"><h3>Delivery spine</h3>',cp()+'<br><div class="card sc"><h3>Delivery spine</h3>');
return h.replace('<div class="card sc"><h3>Project portfolio</h3>',radar()+'<br><div class="card" id="ap">'+apH()+'</div><br><div class="card sc"><h3>Project portfolio</h3>')};
let tw;const r1=render;
render=function(){r1();const b=$('#br');if(!b)return;const t=brief();clearInterval(tw);if($('#v').className=='an'){let i=0;b.classList.add('typing');tw=setInterval(()=>{b.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(tw);b.classList.remove('typing')}},14)}else b.textContent=t};
setInterval(()=>{const on=AU.filter(a=>A.on[a[0]]);if(!on.length||document.querySelector('#ap [data-b]')||!$('#ap'))return;const a=on[Math.random()*on.length|0];A.hrs+=.2;A.log.unshift(['Autopilot: '+a[4],tm()]);A.log=A.log.slice(0,6);ai()},16000);
document.addEventListener('click',e=>{const t=e.target.closest('[data-ai]');if(!t)return;const s=t.dataset.ai,k=s.split(':')[0],v=s.slice(k.length+1);
if(k=='run')run(v);else if(k=='ask')ask(v||$('#aq').value);
else if(k=='ok'){const q=A.q.splice(+v,1)[0];A.hrs+=parseFloat(q[2]);A.log.unshift(['Executed: '+q[0],tm()]);A.log=A.log.slice(0,6);ai();toast('Approved. AI executed: '+q[0])}
else if(k=='no'){A.q.splice(+v,1);ai()}});
document.addEventListener('change',e=>{const s=e.target.dataset.ai;if(s&&s.startsWith('tg:')){const k=s.slice(3);A.on[k]=e.target.checked?1:0;toast((e.target.checked?'Enabled: ':'Paused: ')+AU.find(a=>a[0]==k)[1])}});
document.addEventListener('keydown',e=>{if(e.target.id=='aq'&&e.key=='Enter')ask(e.target.value)});
})();
render();
</script></body></html>
